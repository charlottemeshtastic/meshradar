<!doctype html><html><head><meta charset="utf-8"><title>MeshRadar Theme Preview</title><style>
:root{
  --color-success: #76c9bf;
  --color-error: #fe5734;
  --color-warning: #ffd166;
  --color-caution: #ff9a5c;
  --color-info: #16e3f9;
  --color-danger: #ff4f7b;
  --color-accent: #16e3f9;
  --color-accent-hover: #fe6dc6;
  --color-accent-alt: #fe6dc6;
  --color-accent-muted: #d77bff;
  --color-bg: #170b2e;
  --color-bg-raised: #120824;
  --color-bg-sunken: #0b0518;
  --color-surface: #251448;
  --color-surface-hover: #341e5e;
  --color-surface-active: #452878;
  --color-text: #f6ecff;
  --color-text-muted: #e2d2f7;
  --color-text-subtle: #c6b2e4;
  --color-text-disabled: #8b76b0;
  --color-text-faint: #725d97;
  --color-border: #341e5e;
  --color-border-strong: #452878;
  --color-border-subtle: #725d97;
  --color-surface-inactive: #725d97;

  --chart-1: #16e3f9;
  --chart-2: #fe6dc6;
  --chart-3: #76c9bf;
  --chart-4: #fe5734;
  --chart-5: #be00fe;
  --chart-6: #007f7f;
  --chart-7: #ffd166;
  --chart-8: #f6ecff;}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--color-bg);color:var(--color-text)}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--color-bg-raised);border-bottom:1px solid var(--color-border)}
header img{width:36px} header h1{font-size:20px;margin:0;background:linear-gradient(90deg,var(--chart-1),var(--chart-2));-webkit-background-clip:text;color:transparent}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:8px;padding:12px}
.node{display:flex;justify-content:space-between;padding:8px;border-radius:6px;margin:4px 0;background:var(--color-bg-raised)}
.node:hover{background:var(--color-surface-hover)} .muted{color:var(--color-text-subtle);font-size:12px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;color:#000}
button{background:var(--color-accent);color:#000;border:0;border-radius:6px;padding:8px 14px;font-weight:600;margin-right:8px}
button.alt{background:var(--color-accent-alt)}
.bars{display:flex;align-items:end;gap:8px;height:120px;margin-top:10px} .bars div{flex:1;border-radius:4px 4px 0 0}
.msg{padding:8px 12px;border-radius:10px;margin:6px 0;max-width:70%}
</style></head><body>
<header><img src="meshradar-logo.svg"><h1>MeshRadar</h1><span class="muted">Charlotte Mesh · 3 sources</span></header>
<div class="wrap"><div class="card"><b>Nodes</b>
<div class="node"><span>CLT-Uptown</span><span class="badge" style="background:var(--color-success)">online</span></div>
<div class="node"><span>Lake Norman RPT</span><span class="badge" style="background:var(--color-warning)">2 hops</span></div>
<div class="node"><span>SouthEnd-Base</span><span class="badge" style="background:var(--color-error)">offline</span></div>
<div class="node"><span>NoDa Solar</span><span class="badge" style="background:var(--color-info)">MQTT</span></div>
<p class="muted">Last heard 4m ago</p></div>
<div><div class="card"><b>Channel: LongFast</b>
<div class="msg" style="background:var(--color-surface-active)">Anyone hearing the Crowders Mtn repeater?</div>
<div class="msg" style="background:var(--color-accent);color:#000;margin-left:auto">Loud and clear from Gastonia 📡</div>
<div style="margin-top:10px"><button>Send</button><button class="alt">Traceroute</button></div></div>
<div class="card" style="margin-top:16px"><b>Packets / hour</b><div class="bars">
<div style="height:60%;background:var(--chart-1)"></div><div style="height:85%;background:var(--chart-2)"></div><div style="height:45%;background:var(--chart-3)"></div><div style="height:70%;background:var(--chart-4)"></div><div style="height:95%;background:var(--chart-5)"></div><div style="height:55%;background:var(--chart-6)"></div><div style="height:35%;background:var(--chart-7)"></div><div style="height:80%;background:var(--chart-8)"></div>
</div></div></div></div></body></html>
